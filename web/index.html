<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de proveedor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath d='M20 6 9 17l-5-5'/%3E%3C/svg%3E">
  <style>
    :root {
      --fondo: #f6f7f9; --superficie: #ffffff; --texto: #1c2430; --suave: #5b6675; --borde: #d9dee6;
      --acento: #1d4ed8; --acento-texto: #ffffff; --alerta-fondo: #fff4d6; --alerta-borde: #c98a00;
      --error: #b42318; --herr-fondo: #eef2f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #12161c; --superficie: #1b212a; --texto: #e8ecf2; --suave: #9aa6b6; --borde: #2e3744;
        --acento: #6ea0ff; --acento-texto: #0b1220; --alerta-fondo: #3a2f10; --alerta-borde: #d9a420;
        --error: #ff8a80; --herr-fondo: #232b36;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .app { max-width: 820px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
    header { padding: 16px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
    h1 { font-size: 1.25rem; margin: 0; }
    .meta { color: var(--suave); font-size: .875rem; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .meta svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
    #aviso { margin: 8px 0; padding: 10px 12px; border: 1px solid var(--alerta-borde); background: var(--alerta-fondo); border-radius: 8px; font-size: .9rem; }
    #aviso[hidden] { display: none; }
    #chat { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
    .msg.error { border-color: var(--error); color: var(--error); }
    .msg.confirmacion { border: 2px solid var(--alerta-borde); background: var(--alerta-fondo); }
    .herr { margin-top: 8px; border: 1px solid var(--borde); background: var(--herr-fondo); border-radius: 8px; font-size: .85rem; white-space: normal; }
    .herr summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
    .herr summary svg { width: 15px; height: 15px; flex: none; }
    .herr .detalle { padding: 0 10px 8px 33px; color: var(--suave); font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
    .herr.fallo summary { color: var(--error); }
    .acciones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; }
    button svg { width: 18px; height: 18px; }
    button.primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
    form { display: flex; gap: 8px; padding: 12px 0 20px; position: sticky; bottom: 0; background: var(--fondo); }
    textarea { flex: 1; font: inherit; color: var(--texto); background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; resize: none; min-height: 44px; max-height: 160px; }
    #pensando { color: var(--suave); display: flex; align-items: center; gap: 8px; }
    #pensando[hidden] { display: none; }
    #pensando svg { width: 18px; height: 18px; animation: girar 1s linear infinite; }
    .archivos { margin-top: 8px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .archivos a { color: var(--acento); display: inline-flex; gap: 4px; align-items: center; }
    .archivos svg { width: 15px; height: 15px; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #pensando svg { animation: none; } * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Registro como proveedor</h1>
    <div class="meta">
      <span id="fecha"><i data-lucide="calendar"></i>Fecha de referencia: …</span>
      <span id="modo"></span>
      <button type="button" id="nueva" title="Empezar una sesión nueva"><i data-lucide="rotate-ccw"></i>Sesión nueva</button>
    </div>
  </header>
  <div id="aviso" role="status" hidden></div>
  <main id="chat" aria-live="polite" aria-label="Conversación"></main>
  <div id="pensando" hidden role="status"><i data-lucide="loader-circle"></i><span>Pensando…</span></div>
  <form id="form">
    <label for="entrada" class="sr" style="position:absolute;left:-9999px">Mensaje</label>
    <textarea id="entrada" rows="1" maxlength="2000" placeholder="Ej.: Procesa el caso «ec-corp-andina». No envíes nada todavía." autofocus></textarea>
    <button type="submit" class="primario" id="enviar"><i data-lucide="send"></i>Enviar</button>
  </form>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
(function () {
  "use strict";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const btnEnviar = document.getElementById("enviar");
  const pensando = document.getElementById("pensando");
  const aviso = document.getElementById("aviso");
  let sessionId = null;
  let ocupado = false;

  function almacen(op, clave, valor) {
    try { return op === "get" ? localStorage.getItem(clave) : localStorage.setItem(clave, valor); } catch (e) { return null; }
  }
  function nuevoId() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g, ""); }
  function iconos() { if (window.lucide) window.lucide.createIcons(); }
  function el(tag, clase, texto) {
    const n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto !== undefined) n.textContent = texto;   // siempre textContent: nada del cliente se interpreta como HTML
    return n;
  }
  function icono(nombre) { const i = document.createElement("i"); i.setAttribute("data-lucide", nombre); return i; }
  function bajar() { chat.scrollTop = chat.scrollHeight; }

  function pintarHerramientas(contenedor, llamadas) {
    for (const l of llamadas || []) {
      const d = el("details", "herr" + (l.ok ? "" : " fallo"));
      const s = el("summary");
      s.appendChild(icono(l.ok ? "wrench" : "triangle-alert"));
      s.appendChild(el("span", "", l.nombre + " — " + l.resumen));
      d.appendChild(s);
      d.appendChild(el("div", "detalle", "argumentos: " + JSON.stringify(l.args)));
      contenedor.appendChild(d);
    }
  }

  async function pintarArchivos(contenedor, llamadas) {
    const armado = (llamadas || []).find((l) => l.nombre === "proveedor_armar_paquete" && l.ok && l.args && l.args.caso);
    if (!armado) return;
    try {
      const r = await fetch("/api/paquetes/" + encodeURIComponent(armado.args.caso));
      if (!r.ok) return;
      const data = await r.json();
      const caja = el("div", "archivos");
      for (const a of data.archivos) {
        const link = el("a");
        link.href = "/api/paquetes/" + encodeURIComponent(data.caso) + "/" + a.split("/").map(encodeURIComponent).join("/");
        link.appendChild(icono("download"));
        link.appendChild(document.createTextNode(a));
        caja.appendChild(link);
      }
      contenedor.appendChild(caja);
      iconos();
    } catch (e) { /* los enlaces son una comodidad */ }
  }

  function pintarMensaje(m, esUltimo) {
    const rol = m.rol === "user" ? "user" : "asistente";
    const caja = el("div", "msg " + rol + (m.error ? " error" : "") + (m.needsConfirmation ? " confirmacion" : ""));
    caja.appendChild(document.createTextNode(m.texto));
    if (m.rol !== "user") pintarHerramientas(caja, m.toolCalls);
    if (m.needsConfirmation && esUltimo) {
      const acciones = el("div", "acciones");
      const ok = el("button", "primario"); ok.type = "button"; ok.appendChild(icono("check")); ok.appendChild(document.createTextNode("Confirmar envío"));
      ok.addEventListener("click", () => enviar("", true));
      const no = el("button"); no.type = "button"; no.appendChild(icono("x")); no.appendChild(document.createTextNode("Cancelar"));
      no.addEventListener("click", () => enviar("Cancelar", false));
      acciones.append(ok, no);
      caja.appendChild(acciones);
    }
    chat.appendChild(caja);
    if (m.rol !== "user") pintarArchivos(caja, m.toolCalls);
    iconos();
    bajar();
  }

  function mostrarAviso(texto) { aviso.hidden = !texto; aviso.textContent = texto || ""; }

  function pintarEstado(r) {
    if (r.fechaReferencia) document.getElementById("fecha").lastChild.textContent = "Fecha de referencia: " + r.fechaReferencia;
    const modo = document.getElementById("modo");
    modo.textContent = r.modo === "sin_modelo" ? "Modo sin modelo" : (r.proveedor ? "Modelo: " + r.proveedor + " · " + r.modelo : "");
  }

  async function enviar(texto, confirmar) {
    if (ocupado) return;
    texto = (texto || "").trim();
    if (!texto && !confirmar) return;
    ocupado = true; btnEnviar.disabled = true; pensando.hidden = false;
    document.querySelectorAll(".acciones button").forEach((b) => { b.disabled = true; });
    pintarMensaje({ rol: "user", texto: confirmar ? "Confirmar envío" : texto }, false);
    entrada.value = "";
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId, message: texto, confirm: confirmar }) });
      const data = await res.json();
      if (!res.ok) { pintarMensaje({ rol: "assistant", texto: data.error || "No se pudo completar la solicitud.", error: true }, false); return; }
      sessionId = data.sessionId; almacen("set", "sessionId", sessionId);
      mostrarAviso(data.aviso || "");
      pintarEstado(data);
      pintarMensaje({ rol: "assistant", texto: data.reply, toolCalls: data.toolCalls, needsConfirmation: data.needsConfirmation }, true);
    } catch (e) {
      pintarMensaje({ rol: "assistant", texto: "No pude conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.", error: true }, false);
    } finally {
      ocupado = false; btnEnviar.disabled = false; pensando.hidden = true; entrada.focus();
    }
  }

  async function cargar() {
    sessionId = almacen("get", "sessionId") || nuevoId();
    almacen("set", "sessionId", sessionId);
    try {
      const h = await (await fetch("/api/health")).json();
      pintarEstado({ fechaReferencia: h.fechaReferencia, modo: h.modo, proveedor: h.provider !== "ninguno" ? h.provider : "", modelo: h.model });
      if (h.modo === "sin_modelo") mostrarAviso("No hay modelo configurado: el asistente trabaja en modo sin modelo.");
    } catch (e) { /* sigue */ }
    try {
      const r = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
      if (r.ok) {
        const s = await r.json();
        s.historial.forEach((m, i) => pintarMensaje(m, i === s.historial.length - 1 && Boolean(s.pendiente)));
        return;
      }
    } catch (e) { /* sesión nueva */ }
    pintarMensaje({ rol: "assistant", texto: "Hola. Dime qué caso quieres procesar (por ejemplo «ec-corp-andina») y te cuento qué quedó lleno, qué falta y si el paquete está listo para firma. No envío nada sin tu confirmación." }, false);
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); enviar(entrada.value, false); });
  entrada.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(entrada.value, false); } });
  document.getElementById("nueva").addEventListener("click", () => { sessionId = nuevoId(); almacen("set", "sessionId", sessionId); chat.textContent = ""; mostrarAviso(""); cargar(); });
  iconos();
  cargar();
})();
</script>
</body>
</html>
