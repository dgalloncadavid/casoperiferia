<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de proveedor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2'%3E%3Cpath d='M20 6 9 17l-5-5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="saltar" href="#principal">Saltar al caso</a>

<header class="encabezado">
  <h1>Registro como proveedor</h1>
  <div class="fecha" role="group" aria-labelledby="etq-fecha">
    <label id="etq-fecha" for="fecha"><i data-lucide="calendar"></i> Fecha de referencia</label>
    <input type="date" id="fecha" aria-describedby="ayuda-fecha">
    <button type="button" class="btn" id="fecha-reto">Fecha del reto</button>
    <button type="button" class="btn" id="fecha-hoy">Hoy</button>
    <button type="button" class="btn" id="nueva"><i data-lucide="rotate-ccw"></i> Conversación nueva</button>
  </div>
  <p class="ayuda" id="ayuda-fecha">Los soportes se evalúan a esta fecha. Al cambiarla se recalculan la bandeja, el caso y el reporte.</p>
</header>

<div class="estructura">
  <nav class="vista tarjeta bloque activa" id="bandeja" aria-labelledby="h-bandeja">
    <h2 id="h-bandeja"><i data-lucide="inbox"></i> Casos</h2>
    <ul class="bandeja-lista" id="lista-casos"></ul>
    <button type="button" class="btn btn-reporte" id="ver-reporte"><i data-lucide="clipboard-list"></i> Reporte de faltantes y costo</button>
  </nav>

  <main class="vista" id="principal" tabindex="-1" aria-label="Detalle">
    <div class="tarjeta bloque" id="vacio"><p>Elige un caso de la bandeja para ver qué quedó lleno, qué falta y de dónde sale cada dato.</p></div>
  </main>

  <section class="vista tarjeta" id="chat" aria-labelledby="h-chat">
    <h2 id="h-chat"><i data-lucide="message-square"></i> Conversación</h2>
    <div id="aviso-chat" class="aviso" role="status" hidden></div>
    <div id="mensajes" role="log" aria-live="polite" aria-label="Mensajes"></div>
    <div id="pensando" hidden role="status"><i data-lucide="loader-circle"></i><span>Pensando…</span></div>
    <form class="form-chat" id="form-chat">
      <label for="entrada" class="solo-lector">Mensaje para el asistente</label>
      <textarea id="entrada" rows="2" maxlength="2000" placeholder="Ej.: Procesa el caso ec-corp-andina. No envíes nada todavía."></textarea>
      <button type="submit" class="btn primario" id="enviar"><i data-lucide="send"></i> Enviar</button>
    </form>
  </section>
</div>

<div class="pestanas" role="tablist" aria-label="Secciones">
  <button type="button" role="tab" id="pest-bandeja" aria-controls="bandeja" aria-selected="true"><i data-lucide="inbox"></i>Casos</button>
  <button type="button" role="tab" id="pest-principal" aria-controls="principal" aria-selected="false"><i data-lucide="file-text"></i>Detalle</button>
  <button type="button" role="tab" id="pest-chat" aria-controls="chat" aria-selected="false"><i data-lucide="message-square"></i>Conversación</button>
</div>

<div class="solo-lector" id="anuncio" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
